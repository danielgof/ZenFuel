<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Zen Fuel</title>
    </head>
    <body class="app-shell">
        <div class="container">

            <div id="detect-banner" class="banner hidden"></div>

            <div class="form-card mb-6">
                <div class="form-card-content">
                    <div class="form-row">
                        <div class="form-field">
                            <label class="form-label" for="year-select">Year</label>
                            <select id="year-select" class="select"><option value="">Select</option></select>
                        </div>
                        <div class="form-field">
                            <label class="form-label" for="make-select">Make</label>
                            <select id="make-select" class="select" disabled><option value="">Select</option></select>
                        </div>
                        <div class="form-field">
                            <label class="form-label" for="model-select">Model</label>
                            <select id="model-select" class="select" disabled><option value="">Select</option></select>
                        </div>
                        <div class="form-field">
                            <label class="form-label" for="trim-select">Trim</label>
                            <select id="trim-select" class="select" disabled><option value="">Select</option></select>
                        </div>
                    </div>

                    <button id="detect-btn" class="button">Detect vehicle from active tab</button>
                </div>
            </div>

            <div id="status" class="status-text"></div>

            <div id="loading" class="panel-card loading-panel hidden">Loading vehicle data...</div>

            <div id="result-panel" class="panel-card hidden">
                <div class="result-header">
                    <div class="icon-badge">
                        <span>⛽</span>
                    </div>
                    <div>
                        <h2 class="title">Fuel Economy</h2>
                        <p class="subtitle">EPA estimated efficiency</p>
                    </div>
                </div>

                <div id="metrics-grid"></div>
                <div id="info-grid"></div>
            </div>
        </div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
