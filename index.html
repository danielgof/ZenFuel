<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      /* Ensure the extension window has fixed dimensions fit for a popup */
      body {
        width: 350px;
        background-color: #f8f9fa;
      }
      .text-gradient {
        background: linear-gradient(45deg, #0dcaf0, #0d6efd);
        -webkit-text-fill-color: transparent;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        background-color: #198754;
        border-radius: 50%;
        display: inline-block;
      }
      /* Soft transition animation for dynamic content */
      #output-container {
        transition: all 0.3s ease-in-out;
      }
    </style>
  </head>
  <body>
    <div class="extension-window p-4">
      
      <header class="text-center mb-4">
        <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
          <img src="icons/favicon.png" alt="Zen Fuel" width="28" height="28" onerror="this.style.display='none'"/>
          <h1 class="h4 m-0 fw-bold">Zen Fuel</h1>
        </div>
        <p class="small text-muted mb-0 px-2" style="font-size: 0.8rem;">
          Vehicle efficiency insights powered by fueleconomy.gov
        </p>
      </header>

      <div class="d-grid mb-4">
        <button
          class="btn btn-info btn-lg rounded-3 text-white fw-medium shadow-sm py-2"
          id="read-btn"
        >
          Get vehicle MPG
        </button>
      </div>

      <div id="output-container" class="mb-4">
        <div id="output" class="text-center text-muted small py-2">
          Click above to read the current page...
        </div>

        <div id="data-card" class="card border-0 shadow-sm rounded-4 bg-white d-none">
          <div class="card-body p-3">
            <h6 id="car-title" class="fw-bold text-dark mb-1 small text-center">Vehicle Title</h6>
            <div class="text-center mb-3">
              <span id="car-fuel" class="badge bg-light text-secondary border rounded-pill px-2">Regular</span>
            </div>
            
            <div class="row g-2 text-center">
              <div class="col-4">
                <div class="p-2 bg-light rounded-3">
                  <div class="small text-muted" style="font-size: 0.7rem;">CITY</div>
                  <div id="mpg-city" class="h5 fw-bold text-dark mb-0">--</div>
                </div>
              </div>
              <div class="col-4">
                <div class="p-2 bg-info bg-opacity-10 rounded-3 border border-info border-opacity-20">
                  <div class="small text-info fw-semibold" style="font-size: 0.7rem;">COMB</div>
                  <div id="mpg-comb" class="h4 fw-extrabold text-info mb-0">--</div>
                </div>
              </div>
              <div class="col-4">
                <div class="p-2 bg-light rounded-3">
                  <div class="small text-muted" style="font-size: 0.7rem;">HWY</div>
                  <div id="mpg-hwy" class="h5 fw-bold text-dark mb-0">--</div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>

    </div>

    <script src="popup.js"></script>
  </body>
</html>
